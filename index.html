 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game 🍎</h1>
        <p>Makan apel sebanyak mungkin!</p>

        <div class="score-board">
            Skor: <span id="score">0</span>
            <span id="status">Siap bermain!</span>
        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <button id="startBtn">Mulai Game</button>

        <div class="controls">
            <button data-dir="up">⬆️</button>
            <div>
                <button data-dir="left">⬅️</button>
                <button data-dir="down">⬇️</button>
                <button data-dir="right">➡️</button>
            </div>
        </div>

        <p class="instruction">
            Gunakan tombol panah atau WASD untuk bergerak.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
